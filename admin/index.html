<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#120B27">
<title>Admin · Cousins Trip</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tracker.css">
<style>
  .alogin { display: grid; gap: 10px; max-width: 420px; }
  .alogin[hidden], #adminBody[hidden] { display: none; }
  .alogin label { font: 700 12px/1 DM; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .aerr { font: 700 14px/1.3 DM; color: var(--coral); min-height: 1.3em; }
  .acards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .acard { padding: 16px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,200,87,.45); display: flex; flex-direction: column; }
  .acard b { display: block; font: 400 30px/1 Bebas; letter-spacing: .05em; color: var(--gold); }
  .acard p { margin: 6px 0 14px; font: 500 14px/1.4 DM; color: var(--mute); flex: 1; }
  .arow { display: flex; gap: 8px; flex-wrap: wrap; }
  .arow .btn { text-decoration: none; display: inline-flex; align-items: center; }
  .lockrow { margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="ibtn" href="../" aria-label="Back to the main trip site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg></a>
  </div>
  <header class="hero">
    <div class="bg" style="background-image:url(../img/bg-view.jpg)"></div><div class="shade"></div>
    <div>
      <div class="kick">Organizers only</div>
      <div class="script">Trip</div>
      <div class="huge">Admin</div>
      <p class="lead">Every tracker in one place, with links you can open or copy and share.</p>
    </div>
  </header>

  <section class="sec" aria-labelledby="hAdmin">
    <form id="adminForm" class="alogin" autocomplete="off">
      <h2 id="hAdmin">Unlock</h2>
      <label for="adminPass">Admin password</label>
      <input class="field" id="adminPass" type="password" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Admin password">
      <button class="btn" type="submit">Unlock admin</button>
      <div class="aerr" id="adminErr" role="alert"></div>
    </form>

    <div id="adminBody" hidden>
      <h2>Trackers</h2>
      <p class="sub">This phone stays unlocked as admin until you lock it.</p>
      <div class="acards" id="adminCards"></div>
      <div class="lockrow"><button class="btn ghost small" id="adminLock" type="button">Lock admin on this phone</button></div>
    </div>
  </section>
</div>

<script src="../config.js"></script>
<script src="../tracker.js"></script>
<script>
(function () {
  const { C, $, store, gate, adminBar, isAdmin } = window.TRK;
  gate();
  const base = location.href.split('#')[0].split('?')[0].replace(/admin\/(index\.html)?$/, '');
  const items = [
    { name: 'Admin page', path: 'admin/', what: 'This page. Share it with the other organizers.' },
    { name: 'Main trip site', path: '', what: 'The swipeable trip plan everyone sees.' },
    { name: 'Stays tracker', path: 'stays/', what: 'House options with photos, votes and a side-by-side comparison.' },
    { name: 'Shuttle tracker', path: 'shuttle/', what: 'Shuttle quotes side by side, with the pickup window from everyone’s flights.' }
  ];
  const ahash = s => { let h = 2166136261 >>> 0; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
  let barShown = false;
  function render() {
    const ok = isAdmin();
    $('adminForm').hidden = ok; $('adminBody').hidden = !ok;
    if (!ok) return;
    $('adminCards').innerHTML = items.map(t => '<div class="acard"><b>' + t.name + '</b><p>' + t.what + '</p><div class="arow">' +
      (t.path === 'admin/' ? '' : '<a class="btn small" href="' + base + t.path + '">Open</a>') +
      '<button type="button" class="btn small ghost" data-copy="' + base + t.path + '">Copy link</button></div></div>').join('');
    if (!barShown) { adminBar('admin'); barShown = true; }
  }
  $('adminCards').addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const url = b.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { b.textContent = 'Copied!'; setTimeout(() => { b.textContent = 'Copy link'; }, 1600); })
      .catch(() => prompt('Copy this link:', url));
  });
  $('adminForm').addEventListener('submit', e => {
    e.preventDefault();
    if (C.adminHash && ahash($('adminPass').value.trim().toLowerCase()) === C.adminHash) { store.set('cousins-admin', C.adminHash); $('adminPass').value = ''; $('adminErr').textContent = ''; render(); }
    else { $('adminErr').textContent = 'That’s not the admin password.'; $('adminPass').select(); }
  });
  $('adminLock').addEventListener('click', () => { store.del('cousins-admin'); location.reload(); });
  render();
  if (!isAdmin()) setTimeout(() => { if (!document.getElementById('gate')) $('adminPass').focus(); }, 80);
})();
</script>
</body>
</html>
