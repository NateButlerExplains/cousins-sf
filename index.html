<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Bebas; src: url(fonts/bebas-neue-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Yellowtail; src: url(fonts/yellowtail-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: DM; font-weight: 500; src: url(fonts/dm-sans-latin-500-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: DM; font-weight: 700; src: url(fonts/dm-sans-latin-700-normal.woff2) format('woff2'); font-display: swap; }

  :root { --night: #120B27; --gold: #FFC857; --coral: #FF8A66; --teal: #6FE0D2; --mute: #DCCFEE; --W: min(100vw, 80vh); }
  @supports (height: 1dvh) { :root { --W: min(100vw, 80dvh); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { font-family: DM, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
  button { font-family: inherit; }

  .track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
           scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
           display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 1600px; }
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center;
                 filter: blur(28px) brightness(.55) saturate(1.2); transform: scale(1.1); }

  .card { position: relative; width: var(--W); aspect-ratio: 4 / 5; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .face img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; transition: transform 7s ease-out; }
  .slide.here .face img { transform: scale(1.06); }
  .back { transform: rotateY(180deg); background: var(--night); display: flex; flex-direction: column; justify-content: center; padding: 9%; gap: 4.5%; }
  .bgimg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(22px) brightness(.32) saturate(1.3); }
  .back > *:not(.bgimg) { position: relative; }
  .back .when { font: 700 calc(var(--W) * .034)/1 DM; letter-spacing: .35em; color: var(--gold); text-transform: uppercase; }
  .back .what { font: 400 calc(var(--W) * .13)/.92 Bebas; color: #fff; text-transform: uppercase; }
  .back .row { display: grid; grid-template-columns: 26% 1fr; gap: 3%; align-items: baseline; padding-top: 4%; border-top: 1.5px solid rgba(255,200,87,.35); }
  .back .k { font: 400 calc(var(--W) * .06)/1 Bebas; letter-spacing: .06em; color: var(--gold); }
  .back .v { font: 500 calc(var(--W) * .042)/1.32 DM; color: #fff; }
  .back .close { font: 700 calc(var(--W) * .03)/1 DM; letter-spacing: .25em; color: var(--mute); text-transform: uppercase; margin-top: 2%; }
  .today-chip { position: absolute; top: 3%; right: 3%; z-index: 3; background: var(--coral); color: var(--night); font: 400 calc(var(--W) * .055)/1 Bebas;
                letter-spacing: .08em; padding: 1.4% 3% .8%; transform: rotate(4deg); box-shadow: 0 8px 20px rgba(0,0,0,.4); display: none; }
  .slide.is-today .today-chip { display: block; }

  .panel { position: relative; width: var(--W); aspect-ratio: 4/5; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5);
           display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 7% 7% 9%; }
  .panel > .pbg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .panel > .pshade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,30,.88) 0%, rgba(10,6,30,.5) 42%, rgba(10,6,30,.35) 62%, rgba(10,6,30,.85) 100%); }
  .panel > *:not(.pbg):not(.pshade) { position: relative; }
  .kick { font: 700 calc(var(--W) * .033)/1 DM; letter-spacing: .4em; color: #fff; }
  .script { font: 400 calc(var(--W) * .11)/1 Yellowtail; color: var(--gold); transform: rotate(-4deg); margin: 2% 0 1%; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .huge { font: 400 calc(var(--W) * .19)/.9 Anton; color: #fff; text-transform: uppercase; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .sub { font: 500 calc(var(--W) * .04)/1.35 DM; color: var(--mute); margin-top: 3%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 44px; padding: .4em 1.1em .25em; border: 0; border-radius: 999px;
         background: var(--gold); color: var(--night); font: 400 calc(var(--W) * .052)/1 Bebas; letter-spacing: .08em; text-decoration: none; cursor: pointer;
         box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; border: 1.5px solid rgba(255,255,255,.35); box-shadow: none; }
  .btn[aria-disabled="true"] { opacity: .55; cursor: default; }
  .btn:focus-visible, .choice:focus-visible, .field:focus-visible, .ibtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px 3%; justify-content: center; margin-top: 4%; width: 100%; }
  .note { font: 500 calc(var(--W) * .032)/1.35 DM; color: var(--mute); margin-top: 3%; min-height: 1.4em; }

  .num { font: 400 calc(var(--W) * .36)/.86 Anton; color: #fff; text-shadow: 0 10px 50px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .days { font: 400 calc(var(--W) * .11)/1 Bebas; letter-spacing: .12em; color: var(--gold); }
  .clock { display: flex; gap: 6%; margin-top: 1%; justify-content: center; width: 100%; }
  .clock div { display: flex; flex-direction: column; align-items: center; }
  .clock b { font: 400 calc(var(--W) * .08)/1 Bebas; color: #fff; font-variant-numeric: tabular-nums; }
  .clock span { font: 700 calc(var(--W) * .024)/1 DM; letter-spacing: .3em; color: var(--mute); margin-top: 4px; }
  .wx { margin-top: 4%; display: flex; align-items: center; gap: 4%; padding: 2.2% 5%; border-radius: 18px; background: rgba(18,11,39,.6);
        border: 1.5px solid rgba(111,224,210,.45); font: 500 calc(var(--W) * .034)/1.3 DM; color: #fff; text-align: left; }
  .wx b { font: 400 calc(var(--W) * .085)/1 Bebas; color: var(--teal); white-space: nowrap; }
  .wxdays { display: flex; gap: 3%; margin-top: 3%; width: 100%; justify-content: center; }
  .wxdays div { flex: 1; max-width: 22%; padding: 2% 1%; border-radius: 14px; background: rgba(18,11,39,.6); border: 1.5px solid rgba(111,224,210,.35); }
  .wxdays i { display: block; font: 700 calc(var(--W) * .028)/1 DM; font-style: normal; letter-spacing: .2em; color: var(--mute); }
  .wxdays b { display: block; font: 400 calc(var(--W) * .06)/1.1 Bebas; color: #fff; }
  .wxdays span { display: block; font: 500 calc(var(--W) * .026)/1.2 DM; color: var(--teal); }

  .panel.mappanel { padding: 5% 0 0; justify-content: flex-start; background: var(--night); }
  .mappanel .mhead { padding: 0 6%; }
  .mappanel .huge { font-size: calc(var(--W) * .15); }
  #map { width: 100%; flex: 1; margin-top: 3%; background: #e8e4dc; touch-action: none; }
  .pin { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--night); display: flex; align-items: center; justify-content: center;
         font: 700 14px/1 DM; border: 2px solid #120B27; box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .pin.thu { background: var(--coral); } .pin.fri { background: var(--gold); } .pin.sat { background: var(--teal); } .pin.sun { background: #FF9FBE; }
  .leaflet-popup-content { font: 500 14px/1.35 DM; margin: 10px 14px; color: #120B27; }
  .leaflet-popup-content b { font: 400 22px/1.1 Bebas; letter-spacing: .04em; display: block; }
  .leaflet-popup-content a { color: #6a2fc0; font-weight: 700; }
  .legend { display: flex; gap: 5%; justify-content: center; padding: 2.6% 0 3.2%; font: 700 calc(var(--W) * .028)/1 DM; letter-spacing: .15em; width: 100%; background: var(--night); }
  .legend span::before { content: ''; display: inline-block; width: .9em; height: .9em; border-radius: 50%; margin-right: .4em; vertical-align: -.1em; background: var(--c); }

  .field { width: 100%; min-height: 48px; padding: 0 1em; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.35); background: rgba(18,11,39,.65);
           color: #fff; font: 500 16px/1 DM; }
  .field::placeholder { color: rgba(220,207,238,.7); }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 2.4%; width: 100%; margin-top: 3%; }
  .choices.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .choice { min-height: 48px; border-radius: 14px; border: 1.5px solid rgba(255,200,87,.6); background: rgba(18,11,39,.6); color: #fff; cursor: pointer;
            font: 400 calc(var(--W) * .05)/1 Bebas; letter-spacing: .06em; padding: 3% 2% 2%; }
  .choice.on { background: var(--gold); color: var(--night); }
  .choice small { display: block; font: 700 calc(var(--W) * .026)/1.4 DM; letter-spacing: .1em; color: inherit; opacity: .85; margin-top: 4px; min-height: 1.4em; }
  .qlabel { display: block; font: 400 calc(var(--W) * .058)/1 Bebas; letter-spacing: .08em; color: var(--gold); margin: 5% 0 2%; width: 100%; text-align: left; }

  .topbar { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 8; display: grid; grid-template-columns: 44px 44px; gap: 8px; }
  .topbar .fly { grid-column: 2; border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 0 rgba(255,200,87,.6); animation: flyPulse 2.6s ease-out 1.2s 3; }
  @keyframes flyPulse { 0% { box-shadow: 0 0 0 0 rgba(255,200,87,.6); } 100% { box-shadow: 0 0 0 14px rgba(255,200,87,0); } }
  @media (prefers-reduced-motion: reduce) { .topbar .fly { animation: none; } }
  .ibtn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); background: rgba(18,11,39,.6); color: #fff;
          display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(6px); }
  .ibtn svg { width: 20px; height: 20px; }
  .ibtn.on { background: var(--gold); color: var(--night); border-color: var(--gold); }
  /* confirmation pop-up */
  .pop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(8,5,20,.6); backdrop-filter: blur(4px);
         opacity: 0; pointer-events: none; transition: opacity .2s; }
  .pop.show { opacity: 1; pointer-events: auto; }
  .popcard { width: min(340px, 100%); padding: 26px 22px 20px; border-radius: 22px; background: #1A1033; border: 1.5px solid var(--gold); text-align: center;
             box-shadow: 0 24px 60px rgba(0,0,0,.6); transform: scale(.92); transition: transform .25s cubic-bezier(.2,.9,.3,1.3); }
  .pop.show .popcard { transform: none; }
  .popicon { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; font: 700 34px/1 DM; }
  .popicon.ok { background: var(--teal); color: #120B27; }
  .popicon.dup { background: var(--gold); color: #120B27; }
  .popicon.err { background: var(--coral); color: #120B27; }
  .poptitle { font: 400 34px/1 Anton; color: #fff; text-transform: uppercase; letter-spacing: .01em; }
  .popmsg { font: 500 15px/1.45 DM; color: var(--mute); margin: 10px 0 18px; }
  .popbtns { display: grid; gap: 8px; }
  .popbtn { min-height: 46px; border-radius: 999px; border: 0; background: var(--gold); color: #120B27; font: 400 22px/1 Bebas; letter-spacing: .08em; cursor: pointer; }
  .popbtn.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
  .popbtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  /* cruise comparison */
  .compare { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2%; margin-top: 2%; text-align: left; }
  .compare div { padding: 3% 3.5%; border-radius: 12px; background: rgba(18,11,39,.72); border: 1px solid rgba(255,200,87,.35); font: 500 calc(var(--W) * .027)/1.35 DM; color: #fff; }
  .compare b { display: block; font: 400 calc(var(--W) * .04)/1 Bebas; letter-spacing: .08em; color: var(--gold); margin-bottom: 3%; }
  .compare ul { margin: 0; padding-left: 1.1em; }
  .compare li + li { margin-top: 2%; }
  .cdesc { display: block; margin-top: 4px; font: 500 calc(var(--W) * .027)/1.3 DM; letter-spacing: 0; text-transform: none; opacity: .9; }
  .bothnote { width: 100%; font: 500 calc(var(--W) * .026)/1.3 DM; color: var(--mute); margin-top: 1.5%; text-align: center; }
  /* photo drop */
  .dropbtn { width: 100%; padding: 5% 4%; border-radius: 20px; border: 2px dashed var(--gold); background: rgba(255,200,87,.14); color: #fff; text-decoration: none;
             display: flex; align-items: center; gap: 4%; margin-top: 4%; text-align: left; cursor: pointer; }
  .dropbtn .cam { flex: none; width: calc(var(--W) * .15); height: calc(var(--W) * .15); border-radius: 50%; background: var(--gold); color: #120B27; display: grid; place-items: center; }
  .dropbtn .cam svg { width: 55%; height: 55%; }
  .dropbtn b { display: block; font: 400 calc(var(--W) * .075)/1 Bebas; letter-spacing: .06em; color: var(--gold); }
  .dropbtn span { font: 500 calc(var(--W) * .032)/1.35 DM; color: var(--mute); }
  .dropbtn[aria-disabled="true"] { opacity: .75; }
  .steps { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2%; margin-top: 4%; }
  .steps div { padding: 4% 3%; border-radius: 14px; background: rgba(18,11,39,.72); text-align: center; font: 500 calc(var(--W) * .028)/1.3 DM; color: #fff; }
  .steps i { display: block; font: 400 calc(var(--W) * .07)/1 Anton; font-style: normal; color: var(--gold); margin-bottom: 4%; }
  .dots { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 6px; z-index: 5; pointer-events: none; }
  .dots button { pointer-events: auto; width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.4); cursor: pointer; transition: width .25s, background .25s; }
  .dots button.on { width: 22px; border-radius: 6px; background: var(--gold); }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 5; width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(18,11,39,.55);
         color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: none; backdrop-filter: blur(6px); }
  .nav.prev { left: 18px; } .nav.next { right: 18px; } .nav:disabled { opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .nav { display: block; } }
  .hint { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; padding: 8px 16px; border-radius: 999px;
          background: rgba(18,11,39,.78); font: 500 14px/1.2 DM; color: #fff; transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  .toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 9; max-width: 90vw; padding: 10px 18px; border-radius: 14px;
           background: var(--gold); color: var(--night); font: 700 14px/1.3 DM; box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
  .toast.show { opacity: 1; }

  .gate { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: var(--night); }
  .gate .pbg { position: absolute; inset: 0; background: url(img/bridge.jpg) center / cover; filter: brightness(.45); transform: scale(1.03); }
  .gate form { position: relative; width: min(88vw, 420px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .gate .kick { font-size: 13px; } .gate .script { font-size: 60px; } .gate .huge { font-size: 64px; }
  .gate .sub { font-size: 16px; margin: 4px 0 0; }
  .gate .field { text-align: center; }
  .gate .btn { font-size: 26px; min-width: 60%; }
  .gate .err { font: 700 14px/1.3 DM; color: var(--coral); min-height: 1.3em; }
  .gate[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } .card { transition: none; } .face img, .slide.here .face img { transition: none; transform: none; } }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="pbg"></div>
  <form id="gateForm" autocomplete="off">
    <div class="kick">THE COUSINS PRESENT</div>
    <div class="script">Cousins Trip</div>
    <div class="huge">San Francisco</div>
    <label for="gatePass" class="sub">Family only. Enter the passcode.</label>
    <input class="field" id="gatePass" type="password" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Passcode">
    <button class="btn" type="submit">Let me in</button>
    <div class="err" id="gateErr" role="alert"></div>
  </form>
</div>

<main class="track" id="track" aria-label="Cousins Trip San Francisco"></main>
<div class="topbar">
  <button class="ibtn" id="mapBtn" aria-label="Go to the map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
  </button>
  <button class="ibtn" id="musicBtn" aria-label="Play music" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <button class="ibtn fly" id="flyBtn" aria-label="Flights and van pickups" aria-haspopup="dialog" aria-controls="fsheet">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
  </button>
</div>
<button class="nav prev" id="prev" aria-label="Previous page">&#8249;</button>
<button class="nav next" id="next" aria-label="Next page">&#8250;</button>
<nav class="dots" id="dots" aria-label="Pages"></nav>
<div class="hint" id="hint">Swipe for the plan &rarr; &nbsp;&middot;&nbsp; Tap a page for details</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pop" id="pop" role="alertdialog" aria-modal="true" aria-labelledby="popTitle" aria-describedby="popMsg" hidden><div class="popcard"><div class="popicon" id="popIcon"></div><div class="poptitle" id="popTitle"></div><div class="popmsg" id="popMsg"></div><div class="popbtns" id="popBtns"></div></div></div>
<audio id="music" src="audio/bay-lofi.mp3" loop preload="auto"></audio>

<script src="config.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
  const C = window.TRIP_CONFIG || {};
  const SITE = 'https://natebutlerexplains.github.io/cousins-sf/';
  const TRIP = Date.UTC(2027, 6, 22, 7, 0, 0);   // Thu July 22, 2027, midnight San Francisco time
  const TRIP_DAYS = { '2027-07-22': 'thu', '2027-07-23': 'fri', '2027-07-24': 'sat', '2027-07-25': 'sun' };

  const P = (img, day, alt, when, what, rows, map) => ({ img, day, alt, when, what, rows, map });
  const pages = [
    P('01', null, 'Cousins Trip San Francisco, July 22 to 25, 2027', 'The plan', 'Four days by the bay',
      [['When', 'Thursday, July 22 through Sunday, July 25, 2027'], ['Where', 'San Francisco, California'], ['How', 'Swipe through. Every page is one idea for the trip.']]),
    { kind: 'countdown' },
    P('02', 'thu', 'Thursday 4 PM: sundaes by the bay at Ghirardelli Square', 'Thursday · 4 PM', 'Sundaes by the bay',

      if (location.hash !== '#p' + (i + 1)) history.replaceState(null, '', location.pathname + location.search + '#p' + (i + 1));
    }
    if (i > 0) hint.classList.add('gone');
  }
  track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  addEventListener('keydown', e => {
    if (document.body.classList.contains('fopen') || (e.target.closest && e.target.closest('input, select, #map'))) return;
    if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1);
  });
  addEventListener('resize', () => { track.style.scrollBehavior = 'auto'; track.scrollLeft = cur * track.clientWidth; track.style.scrollBehavior = ''; map && map.invalidateSize(); });
  setTimeout(() => hint.classList.add('gone'), 5000);

  /* day-of mode: during the trip, open on today's first stop (test with ?today=2027-07-23) */
  const sfDate = () => new URLSearchParams(location.search).get('today') || new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' }).format(new Date());
  const todayKey = TRIP_DAYS[sfDate()];
  let startAt = parseInt((location.hash.match(/^#p(\d+)$/) || [])[1], 10) - 1;
  if (todayKey) {
    [...track.children].forEach(s => s.classList.toggle('is-today', s.dataset.day === todayKey));
    if (!(startAt >= 0)) startAt = pages.findIndex(p => p.day === todayKey);
    hint.textContent = 'It’s trip day! Here’s what’s on today →';
  }
  if (startAt > 0) { track.style.scrollBehavior = 'auto'; track.scrollLeft = startAt * track.clientWidth; track.style.scrollBehavior = ''; }
  update();

  /* passcode gate: keeps casual visitors out, not real security */
  const hash = s => { let h = 2166136261 >>> 0; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
  if (C.passcodeHash && store.get('cousins-pass') !== C.passcodeHash) {
    const gate = $('gate'); gate.hidden = false;
    $('gateForm').addEventListener('submit', e => {
      e.preventDefault();
      if (hash($('gatePass').value.trim().toLowerCase()) === C.passcodeHash) { store.set('cousins-pass', C.passcodeHash); gate.hidden = true; }
      else { $('gateErr').textContent = 'Not quite. Ask the family chat for the passcode.'; $('gatePass').select(); }
    });
  }
</script>
<script src="flights.js"></script>
</body>
