<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120B27">
<title>Cousins Trip: San Francisco</title>
<meta property="og:title" content="Cousins Trip: San Francisco">
<meta property="og:description" content="July 22–25, 2027. Swipe through the plan.">
<meta property="og:image" content="https://natebutlerexplains.github.io/cousins-sf/img/share.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120B27'/%3E%3Cpath d='M14 48V22M50 48V22M14 24c8 16 28 16 36 0M8 40h48' stroke='%23FFC857' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Bebas; src: url(fonts/bebas-neue-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Yellowtail; src: url(fonts/yellowtail-latin-400-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: DM; font-weight: 500; src: url(fonts/dm-sans-latin-500-normal.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: DM; font-weight: 700; src: url(fonts/dm-sans-latin-700-normal.woff2) format('woff2'); font-display: swap; }

  :root { --night: #120B27; --gold: #FFC857; --coral: #FF8A66; --mute: #DCCFEE; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { font-family: DM, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

  .track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
           scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }

  .slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
           display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 1600px; }
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center;
                 filter: blur(28px) brightness(.55) saturate(1.2); transform: scale(1.1); }

  /* the 4:5 page, sized to fit any screen */
  .card { position: relative; width: min(100vw, 80vh); width: min(100vw, 80dvh); aspect-ratio: 4 / 5;
          transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
          box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .face img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none;
              transform: scale(1.0); transition: transform 7s ease-out; }
  .slide.here .face img { transform: scale(1.06); }
  .back { transform: rotateY(180deg); background: var(--night); display: flex; flex-direction: column; justify-content: center;
          padding: 9% 9%; gap: 4.5%; }
  .back .bgimg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(22px) brightness(.32) saturate(1.3); }
  .back > *:not(.bgimg) { position: relative; }
  .back .when { font: 700 min(3.4vw, 2.7vh)/1 DM; letter-spacing: .35em; color: var(--gold); text-transform: uppercase; }
  .back .what { font: 400 min(13vw, 10.4vh)/.92 Bebas; letter-spacing: .02em; color: #fff; text-transform: uppercase; margin-top: -1%; }
  .back .row { display: grid; grid-template-columns: 26% 1fr; gap: 3%; align-items: baseline; padding-top: 4%; border-top: 1.5px solid rgba(255,200,87,.35); }
  .back .k { font: 400 min(6vw, 4.8vh)/1 Bebas; letter-spacing: .06em; color: var(--gold); }
  .back .v { font: 500 min(4.2vw, 3.35vh)/1.32 DM; color: #fff; }
  .back .close { font: 700 min(3vw, 2.4vh)/1 DM; letter-spacing: .25em; color: var(--mute); text-transform: uppercase; margin-top: 2%; }

  /* countdown */
  .count { position: relative; width: min(100vw, 80vh); width: min(100vw, 80dvh); aspect-ratio: 4/5; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .count .bgimg { position: absolute; inset: 0; background: url(img/bridge.jpg) center 60% / cover; transform: scale(1.04); }
  .count .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,30,.88) 0%, rgba(10,6,30,.55) 45%, rgba(10,6,30,.85) 100%); }
  .count > div:not(.bgimg):not(.shade) { position: relative; }
  .count .k1 { font: 700 min(3.6vw, 2.9vh)/1 DM; letter-spacing: .4em; color: #fff; }
  .count .script { font: 400 min(12vw, 9.6vh)/1 Yellowtail; color: var(--gold); transform: rotate(-4deg); margin-top: 3%; margin-bottom: 3%; text-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .count .num { font: 400 min(44vw, 35vh)/.86 Anton; color: #fff; margin-top: 2%; text-shadow: 0 10px 50px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .count .days { font: 400 min(13vw, 10.4vh)/1 Bebas; letter-spacing: .12em; color: var(--gold); margin-top: 1%; }
  .count .clock { display: flex; gap: min(5vw, 4vh); margin-top: 5%; }
  .count .clock div { display: flex; flex-direction: column; align-items: center; }
  .count .clock b { font: 400 min(10vw, 8vh)/1 Bebas; color: #fff; font-variant-numeric: tabular-nums; min-width: 2ch; }
  .count .clock span { font: 700 min(2.6vw, 2.1vh)/1 DM; letter-spacing: .3em; color: var(--mute); margin-top: 6px; }
  .count .date { font: 400 min(7vw, 5.6vh)/1 Bebas; letter-spacing: .14em; color: #fff; margin-top: 7%; padding: 2% 5% 1.2%; background: var(--gold); color: var(--night); }

  .dots { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 7px; z-index: 5; pointer-events: none; }
  .dots button { pointer-events: auto; width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.4);
                 cursor: pointer; transition: width .25s, background .25s; }
  .dots button.on { width: 24px; border-radius: 6px; background: var(--gold); }
  .dots button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 5; width: 52px; height: 52px; border-radius: 50%;
         border: 0; background: rgba(18,11,39,.55); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: none; backdrop-filter: blur(6px); }
  .nav.prev { left: 18px; } .nav.next { right: 18px; }
  .nav:disabled { opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .nav { display: block; } }

  .hint { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5;
          padding: 8px 16px; border-radius: 999px; background: rgba(18,11,39,.75); font: 500 14px/1.2 DM; letter-spacing: .5px; color: #fff;
          transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } .card { transition: none; } .face img, .slide.here .face img { transition: none; transform: none; } }
</style>
</head>
<body>
<main class="track" id="track" aria-label="Cousins Trip San Francisco"></main>
<button class="nav prev" id="prev" aria-label="Previous page">&#8249;</button>
<button class="nav next" id="next" aria-label="Next page">&#8250;</button>
<nav class="dots" id="dots" aria-label="Pages"></nav>
<div class="hint" id="hint">Swipe for the plan &rarr; &nbsp;&middot;&nbsp; Tap a page for details</div>

<script>
  // Trip starts Thursday July 22, 2027, midnight San Francisco time (PDT, UTC-7)
  const TRIP = Date.UTC(2027, 6, 22, 7, 0, 0);

  const pages = [
    { img: '01', alt: 'Cousins Trip San Francisco, July 22 to 25, 2027', when: 'The plan', what: 'Four days by the bay',
      rows: [['When', 'Thursday, July 22 through Sunday, July 25, 2027'], ['Where', 'San Francisco, California'], ['How', 'Swipe through. Every page is one idea for the trip.']] },
    { countdown: true },
    { img: '02', alt: 'Thursday 4 PM: sundaes by the bay at Ghirardelli Square', when: 'Thursday · 4 PM', what: 'Sundaes by the bay',
      rows: [['Where', 'Ghirardelli Square, on the waterfront by Fisherman’s Wharf'], ['Do', 'Hot fudge sundaes and the first group photo of the trip'], ['Then', 'A slow walk along Aquatic Park and the bay']] },
    { img: '03', alt: 'Thursday night: welcome dinner at the wharf with the Pier 39 sea lions', when: 'Thursday · 6:30 PM', what: 'Welcome to the wharf',
      rows: [['Dinner', 'Fog Harbor Fish House at Pier 39. Backup: The Crab House'], ['Then', 'Say hi to the sea lions lounging on the docks'], ['Vibe', 'First night, everyone together, bay views']] },
    { img: '04', alt: 'Friday: house day, brunch, games and pizza', when: 'Friday · all day', what: 'House day',
      rows: [['Morning', 'Sleep in, then one big group brunch'], ['Afternoon', 'Backyard and board games, pizza for lunch'], ['Tip', 'Rest up. Friday night is the big one.']] },
    { img: '05', alt: 'Friday night: sunset dinner cruise on the bay', when: 'Friday · 6:30 – 9:30 PM', what: 'Sunset on the bay',
      rows: [['Where', 'City Cruises, Pier 3 on the Embarcadero at Washington St'], ['Onboard', 'Dinner, a DJ, dancing, the skyline lighting up'], ['Bring', 'A jacket. The bay gets cold after sunset.']] },
    { img: '06', alt: 'Saturday morning: Golden Gate overlook and the Palace of Fine Arts', when: 'Saturday · 9:30 AM', what: 'Golden Gate mornings',
      rows: [['First', 'Group photos at the Golden Gate Bridge Welcome Center overlook'], ['Then', 'A walk around the Palace of Fine Arts and its lagoon'], ['Tip', 'Mornings are calmer and the light is softer']] },
    { img: '07', alt: 'Saturday lunch: Mission burritos in Dolores Park', when: 'Saturday · 12:30 PM', what: 'Burritos in the park',
      rows: [['Grab', 'Burritos to go from La Taqueria. Backup: El Farolito'], ['Eat', 'Picnic on the hill at Dolores Park'], ['View', 'The whole downtown skyline behind us']] },
    { img: '08', alt: 'Saturday photo stop: the Painted Ladies at Alamo Square', when: 'Saturday · photo stop', what: 'Postcard row',
      rows: [['Where', 'Alamo Square Park, facing the Painted Ladies'], ['Do', 'One big group photo with the skyline behind'], ['Tip', 'Bring a blanket and hang out on the lawn']] },
    { img: '09', alt: 'Saturday afternoon: cable car ride on the Powell-Hyde line', when: 'Saturday · 2:30 PM', what: 'Ding ding! Cable car',
      rows: [['Line', 'Powell–Hyde, up and over the hills toward the bay'], ['Board', 'At the Powell & Market turnaround, the start of the line'], ['Tip', 'Grab a spot on the outside step if there’s room']] },
    { img: '10', alt: 'Saturday night: family-style dinner in Chinatown', when: 'Saturday · 7 PM', what: 'Family-style Chinatown',
      rows: [['Dinner', 'China Live, one big round table. Backup: R&G Lounge'], ['Order', 'Dumplings, noodles, roast duck. Everything shared'], ['Then', 'A walk under the lanterns on Grant Avenue']] },
    { img: '11', alt: 'Sunday morning: coffee and sourdough at the Ferry Building', when: 'Sunday · 9:30 AM', what: 'Coffee & sourdough',
      rows: [['Where', 'Ferry Building Marketplace on the Embarcadero'], ['Eat', 'Coffee, sourdough, pastries, breakfast bites'], ['Then', 'A stroll along the water with the Bay Bridge in view']] },
    { img: '12', alt: 'Sunday: one last look from Twin Peaks. See you in San Francisco', when: 'Sunday · 11:30 AM', what: 'One last look',
      rows: [['Where', 'Twin Peaks, the 360° view of the whole city'], ['Tip', 'It’s windy up top. Too foggy? We skip it.'], ['Then', 'Pack up around 1 PM and head home']] }
  ];

  const track = document.getElementById('track'), dots = document.getElementById('dots');
  const prev = document.getElementById('prev'), next = document.getElementById('next'), hint = document.getElementById('hint');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  pages.forEach((p, i) => {
    const s = document.createElement('section');
    s.className = 'slide';
    s.setAttribute('aria-label', 'Page ' + (i + 1) + ' of ' + pages.length);
    if (p.countdown) {
      s.innerHTML = '<div class="blur" style="background-image:url(img/01-thumb.jpg)"></div>' +
        '<div class="count" role="timer" aria-live="off"><div class="bgimg"></div><div class="shade"></div>' +
        '<div class="k1">THE COUNTDOWN IS ON</div><div class="script">San Francisco in</div>' +
        '<div class="num" id="cd-days">0</div><div class="days">DAYS</div>' +
        '<div class="clock"><div><b id="cd-h">00</b><span>HRS</span></div><div><b id="cd-m">00</b><span>MIN</span></div><div><b id="cd-s">00</b><span>SEC</span></div></div>' +
        '<div class="date">THURSDAY &middot; JULY 22, 2027</div></div>';
    } else {
      const rows = p.rows.map(r => '<div class="row"><div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(r[1]) + '</div></div>').join('');
      s.innerHTML = '<div class="blur" style="background-image:url(img/' + p.img + '-thumb.jpg)"></div>' +
        '<div class="card" role="button" tabindex="0" aria-pressed="false" aria-label="' + esc(p.alt) + '. Tap for details.">' +
          '<div class="face front"><img src="img/' + p.img + '.jpg" alt="' + esc(p.alt) + '" ' + (i < 3 ? 'fetchpriority="high"' : 'loading="lazy"') + ' draggable="false"></div>' +
          '<div class="face back"><div class="bgimg" style="background-image:url(img/' + p.img + '-thumb.jpg)"></div>' +
            '<div class="when">' + esc(p.when) + '</div><div class="what">' + esc(p.what) + '</div>' + rows +
            '<div class="close">Tap to flip back</div></div>' +
        '</div>';
      const card = s.querySelector('.card');
      const flip = () => { const on = card.classList.toggle('flipped'); card.setAttribute('aria-pressed', on ? 'true' : 'false'); hint.classList.add('gone'); };
      card.addEventListener('click', flip);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    }
    track.appendChild(s);
    const d = document.createElement('button');
    d.setAttribute('aria-label', 'Go to page ' + (i + 1));
    d.addEventListener('click', () => go(i));
    dots.appendChild(d);
  });

  // countdown
  const two = n => String(n).padStart(2, '0');
  function tick() {
    let ms = Math.max(0, TRIP - Date.now());
    const d = Math.floor(ms / 864e5); ms -= d * 864e5;
    const h = Math.floor(ms / 36e5); ms -= h * 36e5;
    const m = Math.floor(ms / 6e4); ms -= m * 6e4;
    document.getElementById('cd-days').textContent = d;
    document.getElementById('cd-h').textContent = two(h);
    document.getElementById('cd-m').textContent = two(m);
    document.getElementById('cd-s').textContent = two(Math.floor(ms / 1000));
  }
  tick(); setInterval(tick, 1000);

  // paging
  let cur = -1;
  function go(i) { i = Math.max(0, Math.min(pages.length - 1, i)); track.scrollTo({ left: i * track.clientWidth }); }
  function update() {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== cur) {
      cur = i;
      [...track.children].forEach((s, k) => {
        s.classList.toggle('here', k === i);
        const c = s.querySelector('.card.flipped');
        if (c && k !== i) { c.classList.remove('flipped'); c.setAttribute('aria-pressed', 'false'); }
      });
      [...dots.children].forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
      prev.disabled = i === 0; next.disabled = i === pages.length - 1;
      if (location.hash !== '#p' + (i + 1)) history.replaceState(null, '', '#p' + (i + 1));
    }
    if (i > 0) hint.classList.add('gone');
  }
  track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
  addEventListener('resize', () => { track.style.scrollBehavior = 'auto'; track.scrollLeft = cur * track.clientWidth; track.style.scrollBehavior = ''; });
  setTimeout(() => hint.classList.add('gone'), 5000);

  const start = parseInt((location.hash.match(/^#p(\d+)$/) || [])[1], 10);
  if (start > 1) { track.style.scrollBehavior = 'auto'; track.scrollLeft = (start - 1) * track.clientWidth; track.style.scrollBehavior = ''; }
  update();
</script>
</body>
</html>
