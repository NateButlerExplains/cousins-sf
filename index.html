<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120B27">
<title>Cousins Trip: San Francisco</title>
<meta property="og:title" content="Cousins Trip: San Francisco">
<meta property="og:description" content="July 22–25, 2027. Swipe through the plan.">
<meta property="og:image" content="https://natebutlerexplains.github.io/cousins-sf/img/share.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120B27'/%3E%3Cpath d='M14 48V22M50 48V22M14 24c8 16 28 16 36 0M8 40h48' stroke='%23FFC857' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --night: #120B27; --gold: #FFC857; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

  .track { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
           scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }

  .slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* soft blurred copy of the page fills any space around it */
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center;
                 filter: blur(28px) brightness(.55) saturate(1.2); transform: scale(1.1); }
  .slide img { position: relative; display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
               aspect-ratio: 4 / 5; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: none; -webkit-user-drag: none; }
  @media (max-aspect-ratio: 4/5) { .slide img { width: 100%; height: auto; } }
  @media (min-aspect-ratio: 4/5) { .slide img { height: 100%; width: auto; } }

  .dots { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; z-index: 5; pointer-events: none; }
  .dots button { pointer-events: auto; width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.4);
                 cursor: pointer; transition: width .25s, background .25s; }
  .dots button.on { width: 26px; border-radius: 6px; background: var(--gold); }
  .dots button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 5; width: 52px; height: 52px; border-radius: 50%;
         border: 0; background: rgba(18,11,39,.55); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: none; backdrop-filter: blur(6px); }
  .nav.prev { left: 18px; } .nav.next { right: 18px; }
  .nav:disabled { opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .nav { display: block; } }

  .hint { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5;
          padding: 8px 16px; border-radius: 999px; background: rgba(18,11,39,.7); font-size: 14px; letter-spacing: .5px; color: #fff;
          transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>
</head>
<body>
<main class="track" id="track" aria-label="Cousins Trip San Francisco, 11 pages"></main>
<button class="nav prev" id="prev" aria-label="Previous page">&#8249;</button>
<button class="nav next" id="next" aria-label="Next page">&#8250;</button>
<nav class="dots" id="dots" aria-label="Pages"></nav>
<div class="hint" id="hint">Swipe to see the plan &rarr;</div>

<script>
  const pages = [
    "Cousins Trip San Francisco, July 22 to 25, 2027",
    "Thursday 4 PM: sundaes by the bay at Ghirardelli Square",
    "Thursday night: welcome dinner at the wharf with the Pier 39 sea lions",
    "Friday: house day, brunch, games and pizza",
    "Friday night: sunset dinner cruise on the bay, under the Golden Gate and past Alcatraz",
    "Saturday morning: Golden Gate overlook and the Palace of Fine Arts",
    "Saturday lunch: Mission burritos in Dolores Park",
    "Saturday afternoon: cable car ride on the Powell-Hyde line",
    "Saturday night: family-style dinner in Chinatown",
    "Sunday morning: coffee and sourdough at the Ferry Building",
    "Sunday: one last look from Twin Peaks. See you in San Francisco"
  ];
  const track = document.getElementById('track'), dots = document.getElementById('dots');
  const prev = document.getElementById('prev'), next = document.getElementById('next'), hint = document.getElementById('hint');

  pages.forEach((alt, i) => {
    const n = String(i + 1).padStart(2, '0');
    const s = document.createElement('section');
    s.className = 'slide';
    s.setAttribute('aria-label', 'Page ' + (i + 1) + ' of ' + pages.length);
    s.innerHTML = '<div class="blur" style="background-image:url(img/' + n + '-thumb.jpg)"></div>' +
                  '<img src="img/' + n + '.jpg" alt="' + alt + '" ' + (i < 2 ? 'fetchpriority="high"' : 'loading="lazy"') + ' draggable="false">';
    track.appendChild(s);
    const d = document.createElement('button');
    d.setAttribute('aria-label', 'Go to page ' + (i + 1));
    d.addEventListener('click', () => go(i));
    dots.appendChild(d);
  });

  let cur = 0;
  function go(i) { i = Math.max(0, Math.min(pages.length - 1, i)); track.scrollTo({ left: i * track.clientWidth }); }
  function update() {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== cur || !dots.children[i].classList.contains('on')) {
      cur = i;
      [...dots.children].forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
      prev.disabled = i === 0; next.disabled = i === pages.length - 1;
      if (location.hash !== '#p' + (i + 1)) history.replaceState(null, '', '#p' + (i + 1));
    }
    if (i > 0) hint.classList.add('gone');
  }
  track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
  addEventListener('resize', () => { track.style.scrollBehavior = 'auto'; track.scrollLeft = cur * track.clientWidth; track.style.scrollBehavior = ''; });
  setTimeout(() => hint.classList.add('gone'), 4000);

  const start = parseInt((location.hash.match(/^#p(\d+)$/) || [])[1], 10);
  if (start > 1) { track.style.scrollBehavior = 'auto'; track.scrollLeft = (start - 1) * track.clientWidth; track.style.scrollBehavior = ''; }
  update();
</script>
</body>
</html>
